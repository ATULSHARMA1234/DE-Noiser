[pytest]
asyncio_mode = auto
pythonpath = src
testpaths = tests

# `integration` tests talk to real infrastructure (ClickHouse today) instead of
# a substitute. They skip themselves when nothing is reachable, so the default
# `pytest` run is unchanged, and CI runs them as a separate job with the
# containers up.
#
# They exist because the substituted tests cannot fail the way production does:
# the trace ingest path wrote None into a non-Nullable column for its whole
# life, losing every batch, while the mocked tests stayed green — a mock accepts
# whatever it is handed.
#
#   docker compose -f docker-compose-infra.yml up -d
#   uv run pytest -m integration
markers =
    integration: requires real infrastructure; skipped when it is not reachable
