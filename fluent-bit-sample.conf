[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# ----------------------------------------------------
# 1. READ LOGS FROM YOUR ENVIRONMENT
# ----------------------------------------------------

# Example: Read from Kubernetes container logs
[INPUT]
    Name             tail
    Path             /var/log/containers/*.log
    Parser           docker
    Tag              kube.*
    Refresh_Interval 5

# Example: Read from System Logs (Syslog)
[INPUT]
    Name             syslog
    Mode             tcp
    Listen           0.0.0.0
    Port             5140
    Tag              syslog.*

# ----------------------------------------------------
# 2. FILTER & ENRICH LOGS
# ----------------------------------------------------

# (Optional) Add Kubernetes metadata to logs
[FILTER]
    Name             kubernetes
    Match            kube.*
    Kube_URL         https://kubernetes.default.svc:443
    Kube_CA_File     /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File  /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix  kube.var.log.containers.

# ----------------------------------------------------
# 3. OUTPUT DIRECTLY TO SEMANTIC-OS
# ----------------------------------------------------

[OUTPUT]
    Name             http
    Match            *
    # Replace with SemanticOS server IP/DNS if running across network
    Host             127.0.0.1  
    Port             8000
    URI              /ingest
    Format           json
    Retry_Limit      False
