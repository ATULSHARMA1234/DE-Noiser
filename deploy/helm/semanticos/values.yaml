replicaCount: 1

image:
  apiRepository: ghcr.io/atulsharma1234/de-noiser/semanticos-api
  webRepository: ghcr.io/atulsharma1234/de-noiser/semanticos-web
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  apiPort: 8000
  webPort: 3000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: semanticos.local
      paths:
        - path: /
          pathType: Prefix
          backend: web
        - path: /api/
          pathType: Prefix
          backend: api
  tls: []

postgres:
  host: "postgres-db"
  user: "postgres"
  db: "semanticos"
  # Never commit a real password here. Provide it at install time via
  #   helm install ... --set postgres.password=$PGPASS
  # or, preferably, set existingSecret to the name of a Secret (with key
  # `database-url`) managed by your secrets store (Vault / Sealed Secrets / ESO).
  password: ""
  existingSecret: ""

redis:
  url: "redis://redis-master:6379/0"
