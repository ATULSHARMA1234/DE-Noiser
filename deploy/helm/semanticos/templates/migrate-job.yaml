{{- if .Values.migrations.enabled }}
{{- /*
  Runs `alembic upgrade head` before install/upgrade. Running migrations here —
  rather than letting each replica auto-migrate on boot — is the safe pattern
  once more than one API pod can start at once (the app itself warns about this).
  Deployments therefore set SEMANTICOS_AUTO_MIGRATE=0.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "semanticos.fullname" . }}-migrate
  labels:
    {{- include "semanticos.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semanticos.name" . }}-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "semanticos.env" . | nindent 12 }}
{{- end }}
