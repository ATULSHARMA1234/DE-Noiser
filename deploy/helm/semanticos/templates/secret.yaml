{{- /*
  Creates the application Secret only when an externally-managed one is not
  supplied. When secrets.existingSecret is set, this renders nothing and every
  workload references that Secret instead — keeping credentials out of the chart
  and out of version control. The Secret must then provide these keys:
    database-url, jwt-secret-key, admin-password, ingest-api-key,
    scim-bearer-token, clickhouse-password, metrics-token
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semanticos.fullname" . }}-secrets
  labels:
    {{- include "semanticos.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.postgres.url | default (printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user (required "postgres.password is required (or set secrets.existingSecret)" .Values.postgres.password) .Values.postgres.host .Values.postgres.db) | quote }}
  jwt-secret-key: {{ required "secrets.jwtSecretKey is required (>=32 chars)" .Values.secrets.jwtSecretKey | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  ingest-api-key: {{ .Values.secrets.ingestApiKey | quote }}
  scim-bearer-token: {{ .Values.secrets.scimBearerToken | quote }}
  clickhouse-password: {{ .Values.clickhouse.password | quote }}
  # Bearer token the Prometheus scrape must present to /internal/metrics. Left
  # empty the API refuses the scrape in production rather than publishing the
  # deployment's route inventory and traffic profile to the namespace.
  metrics-token: {{ .Values.secrets.metricsToken | quote }}
{{- end }}
