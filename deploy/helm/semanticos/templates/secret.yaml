{{- /*
  Creates the DB connection Secret only when an externally-managed secret is not
  supplied. When postgres.existingSecret is set, this template renders nothing and
  the deployment references that Secret instead — keeping credentials out of the
  chart and out of version control.
*/ -}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semanticos.fullname" . }}-db
  labels:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}
    helm.sh/chart: {{ include "semanticos.chart" . }}
type: Opaque
stringData:
  database-url: "postgresql://{{ .Values.postgres.user }}:{{ required "postgres.password is required: pass --set postgres.password=... or set postgres.existingSecret" .Values.postgres.password }}@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.db }}"
{{- end }}
