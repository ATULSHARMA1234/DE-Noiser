apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semanticos.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semanticos.name" . }}-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semanticos.name" . }}-web
    spec:
      containers:
        - name: {{ .Chart.Name }}-web
          image: "{{ .Values.image.webRepository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
