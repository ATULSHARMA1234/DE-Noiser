{{- if .Values.syslog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semanticos.fullname" . }}-syslog
  labels:
    {{- include "semanticos.labels" . | nindent 4 }}
    app.kubernetes.io/component: syslog
spec:
  replicas: {{ .Values.syslog.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semanticos.name" . }}-syslog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semanticos.name" . }}-syslog
        app.kubernetes.io/component: syslog
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: syslog
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "denoiser.ingestion.syslog_server"]
          env:
            {{- include "semanticos.env" . | nindent 12 }}
            - name: SYSLOG_UDP_PORT
              value: {{ .Values.syslog.containerPort | quote }}
            - name: SYSLOG_TCP_PORT
              value: {{ .Values.syslog.containerPort | quote }}
          ports:
            - name: syslog-udp
              containerPort: {{ .Values.syslog.containerPort }}
              protocol: UDP
            - name: syslog-tcp
              containerPort: {{ .Values.syslog.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.syslog | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semanticos.fullname" . }}-syslog
  labels:
    {{- include "semanticos.labels" . | nindent 4 }}
    app.kubernetes.io/component: syslog
spec:
  type: {{ .Values.syslog.serviceType }}
  selector:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}-syslog
  ports:
    - name: syslog-udp
      port: {{ .Values.syslog.port }}
      targetPort: {{ .Values.syslog.containerPort }}
      protocol: UDP
    - name: syslog-tcp
      port: {{ .Values.syslog.port }}
      targetPort: {{ .Values.syslog.containerPort }}
      protocol: TCP
{{- end }}
