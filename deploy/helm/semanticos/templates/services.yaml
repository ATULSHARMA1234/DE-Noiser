apiVersion: v1
kind: Service
metadata:
  name: {{ include "semanticos.fullname" . }}-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}-api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semanticos.fullname" . }}-web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.webPort }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}-web
