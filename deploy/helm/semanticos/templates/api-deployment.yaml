apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semanticos.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "semanticos.name" . }}-api
    helm.sh/chart: {{ include "semanticos.chart" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "semanticos.name" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "semanticos.name" . }}-api
    spec:
      containers:
        - name: {{ .Chart.Name }}-api
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-db" (include "semanticos.fullname" .)) }}
                  key: database-url
            - name: REDIS_URL
              value: "{{ .Values.redis.url }}"
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "semanticos.fullname" . }}-pvc
