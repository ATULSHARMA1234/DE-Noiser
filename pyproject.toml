[project]
name = "semantic-log-denoiser"
# Kept in step with the Helm chart's appVersion; a `helm install` with no
# --set pulls the image tagged with this. Bump both in the release commit.
version = "2.0.0"
description = "Privacy-first on-premise log analysis and observability platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Atul" },
]
keywords = ["logs", "sre", "devops", "anomaly-detection", "clustering", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # --- Data Processing ---
    "polars>=1.0.0",
    # --- AI / ML ---
    "sentence-transformers>=3.0.0",
    # torch is pulled in by sentence-transformers; declared explicitly so the
    # CPU-only source below applies (avoids ~3GB of unused CUDA/NVIDIA wheels).
    "torch>=2.0.0",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    # --- Vector Storage ---
    "lancedb>=0.9.0",
    # --- CLI & TUI ---
    "typer>=0.12.0",
    "shellingham>=1.5.0",
    "rich>=13.7.0",
    # --- Utilities ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "orjson>=3.10.0",
    # --- Intelligence (Phase 2) ---
    "openai>=1.0.0",
    # --- Integrations (Phase 3) ---
    "kubernetes>=29.0.0",
    "boto3>=1.34.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.0",
    "websockets>=16.0",
    "python-multipart>=0.0.27",
    "psutil>=5.9.0",
    "apscheduler>=3.11.2",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "clickhouse-connect>=1.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "statsmodels>=0.14.6",
    "pandas>=3.0.3",
    "aiokafka>=0.14.0",
    "alembic>=1.13.0",
    "signxml>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.23.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
semantic-log = "denoiser.cli.main:app"

# On Linux (the deployment target), pull torch from PyTorch's CPU-only index so
# the image doesn't drag in ~3GB of unused CUDA/NVIDIA/Triton wheels. macOS keeps
# resolving torch from PyPI (already CPU there) for local development.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denoiser"]

[tool.ruff]
target-version = "py312"
line-length = 200
src = ["src"]

[tool.ruff.lint]
# T20 (flake8-print) is deliberate: a bare print() in library or server code
# writes to stdout with no level, no correlation id and nothing an operator can
# filter on in production. The CLI and the Rich reporters are exempt below —
# printing is their job.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "T20"]
# F821 (undefined name) and F841 (unused local) are deliberately NOT ignored:
# they catch real defects — a NameError waiting to happen, and a computed value
# that is silently thrown away — rather than style.
ignore = ["E402", "E501", "E701", "E712", "E722", "E741", "RUF002", "RUF012", "RUF013", "B904", "B905", "SIM108", "N806", "W291", "W293", "RUF005", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
# Writing to the terminal is what these do.
"src/denoiser/cli/*" = ["T20"]
"src/denoiser/reporting/*" = ["T20"]
"scripts/*" = ["T20"]
# Tests print diagnostics when they fail; that output is the point.
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
