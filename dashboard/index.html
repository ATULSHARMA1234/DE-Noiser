<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Log De-Noiser | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and Babel for single-file demo -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const StatusBadge = ({ label }) => {
            const colors = {
                'high_risk_anomaly': 'bg-red-500/20 text-red-400 border-red-500/50',
                'new_pattern': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50',
                'known': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50',
            };
            return (
                <span className={`px-2 py-1 rounded text-xs font-semibold border ${colors[label] || 'bg-slate-500/20 text-slate-400 border-slate-500/50'}`}>
                    {label.toUpperCase().replace('_', ' ')}
                </span>
            );
        };

        const Dashboard = () => {
            const [loading, setLoading] = useState(false);
            const [source, setSource] = useState('data/demo_incident.log');
            const [data, setData] = useState(null);
            const [error, setError] = useState(null);

            const runAnalysis = async () => {
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch('http://localhost:8000/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ source, baseline: 'data/test_baseline.index' })
                    });
                    if (!response.ok) throw new Error('Failed to fetch data from API');
                    const result = await response.ok ? await response.json() : null;
                    setData(result);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen p-6 lg:p-12 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="flex justify-between items-center mb-12">
                        <div>
                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-emerald-400">
                                Semantic Log De-Noiser
                            </h1>
                            <p className="text-slate-400 mt-1">Enterprise Observability Intelligence</p>
                        </div>
                        <div className="flex gap-4">
                            <input 
                                value={source}
                                onChange={(e) => setSource(e.target.value)}
                                className="glass px-4 py-2 rounded-lg outline-none focus:ring-2 ring-cyan-500/50 w-64 mono text-sm"
                                placeholder="k8s://pod-name or path/to/log"
                            />
                            <button 
                                onClick={runAnalysis}
                                disabled={loading}
                                className="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-lg font-semibold transition-all flex items-center gap-2"
                            >
                                {loading ? 'Analyzing...' : 'Run Analysis'}
                            </button>
                        </div>
                    </header>

                    {error && (
                        <div className="bg-red-500/10 border border-red-500/50 p-4 rounded-xl text-red-400 mb-8">
                            Error: {error}. Make sure the FastAPI backend is running on port 8000.
                        </div>
                    )}

                    {!data && !loading && (
                        <div className="flex flex-col items-center justify-center h-64 glass rounded-3xl opacity-50 border-dashed">
                            <p className="text-xl">Enter a log source and click "Run Analysis" to begin.</p>
                        </div>
                    )}

                    {data && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* AI Insights Card */}
                            <div className="lg:col-span-2 glass p-8 rounded-3xl border-cyan-500/20 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                    <i data-lucide="sparkles" className="w-24 h-24 text-cyan-400"></i>
                                </div>
                                <h2 className="text-xl font-bold flex items-center gap-2 mb-6">
                                    <span className="p-2 bg-cyan-500/20 rounded-lg text-cyan-400">✨</span>
                                    AI Incident Intelligence
                                </h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Failure Domain</h3>
                                        <p className="text-2xl font-semibold text-emerald-400">{data.intelligence?.failure_domain || 'Unknown'}</p>
                                    </div>
                                    
                                    <div>
                                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Summary</h3>
                                        <p className="text-lg leading-relaxed">{data.intelligence?.incident_summary}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="p-4 bg-slate-800/50 rounded-2xl border border-white/5">
                                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Next Steps</h3>
                                            <ul className="text-sm space-y-2 list-disc list-inside text-slate-300">
                                                {data.intelligence?.root_cause_hints?.map((hint, i) => (
                                                    <li key={i}>{hint}</li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div className="p-4 bg-slate-800/50 rounded-2xl border border-white/5">
                                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Total Volume</h3>
                                            <p className="text-3xl font-bold">{data.total_logs}</p>
                                            <p className="text-xs text-slate-500">Logs ingested</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Health Score / Side Card */}
                            <div className="glass p-8 rounded-3xl border-red-500/20 flex flex-col items-center justify-center text-center">
                                <h2 className="text-lg font-semibold text-slate-400 mb-8">System Anomaly Score</h2>
                                <div className="relative w-48 h-48 flex items-center justify-center">
                                    <svg className="w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="80" stroke="currentColor" strokeWidth="12" fill="transparent" className="text-slate-800" />
                                        <circle 
                                            cx="96" cy="96" r="80" stroke="currentColor" strokeWidth="12" fill="transparent" 
                                            className="text-red-500"
                                            strokeDasharray={502}
                                            strokeDashoffset={502 - (502 * 0.85)} // Simulated 85% anomaly
                                        />
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        <span className="text-5xl font-bold">85</span>
                                        <span className="text-xs uppercase tracking-tighter text-slate-500">Critical</span>
                                    </div>
                                </div>
                                <p className="mt-8 text-sm text-slate-400 italic">"Detected unusual patterns in Kernel space compared to stable baseline."</p>
                            </div>

                            {/* Table */}
                            <div className="lg:col-span-3 glass rounded-3xl overflow-hidden">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-800/50 border-b border-white/5">
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-widest">ID</th>
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Count</th>
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Anomaly</th>
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Semantic Summary</th>
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Representative Log</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.clusters.map((cluster) => (
                                            <tr key={cluster.id} className="border-b border-white/5 hover:bg-white/5 transition-colors group">
                                                <td className="p-4 font-mono text-cyan-500">#{cluster.id === -1 ? 'NOISE' : cluster.id}</td>
                                                <td className="p-4">{cluster.size}</td>
                                                <td className="p-4">
                                                    <StatusBadge label={cluster.anomaly_label} />
                                                </td>
                                                <td className="p-4 text-slate-300 font-medium">{cluster.summary}</td>
                                                <td className="p-4 text-xs mono text-slate-500 max-w-md truncate">
                                                    {cluster.representative_log}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
        
        // Initialize Lucide icons
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
