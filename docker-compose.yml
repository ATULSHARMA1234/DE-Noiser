version: '3.8'

# ── Shared backend environment (api + worker run the same image/config) ───────
# Top-level x- extension holding a YAML anchor so api and worker stay in sync.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it}@db:5432/${POSTGRES_DB:-semanticos}
  REDIS_URL: redis://redis:6379/0
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  KAFKA_BROKER: redpanda:29092
  MINIO_ENDPOINT: minio:9000
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  # Auth — JWT_SECRET_KEY and the admin password are mandatory; the API refuses
  # to start without them.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required — set it in .env}
  SEMANTICOS_ADMIN_PASSWORD: ${SEMANTICOS_ADMIN_PASSWORD:?SEMANTICOS_ADMIN_PASSWORD is required — this is your admin login}
  INGEST_API_KEY: ${INGEST_API_KEY:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost}
  # Keep torch's thread pools bounded so inference doesn't oversubscribe a small VM.
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: semanticos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # Frontend Next.js Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: semanticos-web
    environment:
      - NODE_ENV=production
    # Port 3000 exposed internally to nginx
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-api
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Analysis Worker (Celery) — consumes /analyze jobs and runs the clustering
  # pipeline. Without this service, analysis tasks queue but never complete.
  # -B runs the embedded beat scheduler for periodic SLO evaluation.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-worker
    # --pool=solo: torch inference deadlocks under Celery's default fork pool
    # (OpenMP threads don't survive fork). solo runs tasks without forking.
    command: ["celery", "-A", "denoiser.workers.analysis_worker:celery_app", "worker", "-B", "--pool=solo", "--loglevel=info"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: semanticos-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it}
      - POSTGRES_DB=${POSTGRES_DB:-semanticos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hyperscale Ingestion Buffer
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: semanticos-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - 9092:9092
      - 29092:29092
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # Redis (Message Broker & Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: semanticos-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: semanticos-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ClickHouse (Analytics Database)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: semanticos-clickhouse
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
  redpanda_data:
