version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: semanticos-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  # Frontend Next.js Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: semanticos-web
    environment:
      - NODE_ENV=production
    # Port 3000 exposed internally to nginx

  # Backend FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/semanticos
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: semanticos-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=semanticos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Message Broker & Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: semanticos-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: semanticos-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ClickHouse (Analytics Database)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: semanticos-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
