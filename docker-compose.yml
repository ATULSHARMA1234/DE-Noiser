x-backend-env: &id001
  DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD\
    \ is required \u2014 copy .env.example to .env and set it}@db:5432/${POSTGRES_DB:-semanticos}"
  REDIS_URL: redis://redis:6379/0
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  KAFKA_BROKER: kafka:29092
  MINIO_ENDPOINT: minio:9000
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required \u2014 set it in .env}"
  SEMANTICOS_ADMIN_PASSWORD: "${SEMANTICOS_ADMIN_PASSWORD:?SEMANTICOS_ADMIN_PASSWORD\
    \ is required \u2014 this is your admin login}"
  INGEST_API_KEY: ${INGEST_API_KEY:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost}
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  SLD_LLM_API_KEY: ${SLD_LLM_API_KEY:-}
  SLD_LLM_MODEL: ${SLD_LLM_MODEL:-}
  SLD_LLM_BASE_URL: ${SLD_LLM_BASE_URL:-}
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: semanticos-web
    environment:
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 500M
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-api
    ports:
    - 8000:8000
    environment: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
    - ./data:/app/data
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200
        else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-worker
    command:
    - celery
    - -A
    - denoiser.workers.analysis_worker:celery_app
    - worker
    - -B
    - --pool=solo
    - --loglevel=info
    environment: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
    - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-ingestion
    command:
    - python
    - -m
    - denoiser.workers.ingestion_worker
    environment: *id001
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
  syslog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semanticos-syslog
    command:
    - python
    - -m
    - denoiser.ingestion.syslog_server
    environment:
      <<: *id001
      SYSLOG_UDP_PORT: '5514'
      SYSLOG_TCP_PORT: '5514'
    # 514 is privileged; map the host's standard syslog port to the container's
    # unprivileged 5514 so senders can still target :514.
    ports:
    - "514:5514/udp"
    - "514:5514/tcp"
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
  db:
    image: postgres:15-alpine
    container_name: semanticos-db
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required \u2014\
      \ copy .env.example to .env and set it}"
    - POSTGRES_DB=${POSTGRES_DB:-semanticos}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
  # Apache Kafka, not Redpanda. Redpanda is BSL 1.1: fine to run yourself,
  # not fine to offer to third parties as a managed service — which means the
  # default stack decided a licensing question that belongs to whoever deploys
  # it. The broker is spoken to through `aiokafka`, so this is the same
  # protocol either way; only the image changes.
  #
  # Single-node KRaft (no ZooKeeper). To go back to Redpanda:
  #   docker compose -f docker-compose.yml -f docker-compose.redpanda.yml up -d
  kafka:
    image: apache/kafka:3.9.0
    container_name: semanticos-kafka
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      # `://:port`, not `://0.0.0.0:port`. On a combined broker+controller node
      # 3.9 derives the advertised address from this and then refuses to start
      # against "the nonroutable meta-address 0.0.0.0".
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,OUTSIDE://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: the internal topics cannot be replicated onto nodes that
      # do not exist, and the defaults (3) leave the cluster unable to create
      # __consumer_offsets at all, which fails the consumer, not the broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # Nothing creates `logs_topic` up front — the producer's first send does.
      # This is the default, set explicitly because the ingest path depends on it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image's entrypoint formats the log directory on first boot and needs
      # a stable cluster id to do it, or every restart formats a new cluster and
      # abandons the volume it wrote last time.
      CLUSTER_ID: semanticos-single-node-1
    # The image runs as uid 1000 and Docker creates a named volume's mountpoint
    # root-owned, so without this the broker cannot write its own log dir.
    user: root
    ports:
    - 127.0.0.1:9092:9092
    - 127.0.0.1:29092:29092
    volumes:
    - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092
        >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
  redis:
    image: redis:7-alpine
    container_name: semanticos-redis
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
  minio:
    image: minio/minio:latest
    container_name: semanticos-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
    - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 3
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: semanticos-clickhouse
    environment:
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
    ports:
    - 127.0.0.1:8123:8123
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3G
  caddy:
    image: caddy:2-alpine
    container_name: semanticos-caddy
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  clickhouse_data: null
  kafka_data: null
  # Kept declared so `docker compose -f … -f docker-compose.redpanda.yml` works
  # and so an existing install's broker volume is not orphaned by the switch.
  redpanda_data: null
  caddy_data: null
  caddy_config: null
