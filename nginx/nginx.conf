events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend (FastAPI)
    upstream api {
        server api:8000;
    }

    # Upstream frontend (Next.js)
    upstream web {
        server web:3000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Mirrors denoiser.api.middleware.SecurityHeadersMiddleware. Duplicated
        # on purpose: a deployment that terminates here and proxies to something
        # other than the API — a static error page, a maintenance splash — still
        # gets them, and the application no longer has to be the only thing
        # standing between a browser and a missing header.
        #
        # "always" so they are sent on error responses too, which is where nginx
        # otherwise drops add_header directives.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Frontend routes
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API routes
        location /api/ {
            # Rewrite /api/foo to /foo for the backend, if needed. 
            # Or just pass / if the backend is configured with no prefix.
            # Currently backend runs at / so we rewrite /api/(.*) to /$1
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket streaming route
        location /stream {
            # Map /api/stream -> /stream or just keep /stream depending on how frontend calls it.
            # The frontend calls /stream directly using WS_BASE which is mapped to ws://localhost:8000/stream locally.
            # In compose, it will call ws://localhost/stream.
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
