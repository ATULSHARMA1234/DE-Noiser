name: Performance

# Nightly rather than per-PR, deliberately. A load test on a shared CI runner is
# noisy: run it on every pull request and it fails often enough to be ignored,
# which is worse than not having it. Nightly on main, with generous tolerances,
# catches the regression that matters — the one that halves throughput — without
# training anyone to skip a red check.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Record this run as the new baseline instead of checking against it"
        type: boolean
        default: false

jobs:
  ingest-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: semanticos_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/semanticos_perf
      REDIS_URL: redis://localhost:6379/0
      SEMANTICOS_ENV: development
      JWT_SECRET_KEY: perf-only-not-a-real-secret-key-00000
      INGEST_API_KEY: perf-ingest-key
      # No Kafka or ClickHouse. The gate measures the API's own request path —
      # parse, redact, serialise, enqueue — which is the part a code change can
      # regress. Standing up the whole pipeline would measure the broker's
      # scheduling variance and call it our latency.
      SEMANTICOS_MAX_UPLOAD_BYTES: "10485760"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Start the API
        run: |
          uv run python -m uvicorn denoiser.api.main:app \
            --host 127.0.0.1 --port 8000 --workers 2 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; exit 1

      # A short warm-up first: the first requests pay for imports, connection
      # pools and JIT-ish warm paths, and folding that into the measurement
      # makes every run look like a regression against a warm baseline.
      - name: Warm up
        run: |
          uv run python scripts/loadtest.py \
            --url http://127.0.0.1:8000 --api-key "$INGEST_API_KEY" \
            --concurrency 4 --duration 10 --batch 100

      - name: Load test
        run: |
          uv run python scripts/loadtest.py \
            --url http://127.0.0.1:8000 --api-key "$INGEST_API_KEY" \
            --concurrency 16 --duration 60 --batch 200 \
            --json perf-results.json

      - name: Check against the baseline
        if: ${{ !inputs.update_baseline }}
        run: uv run python scripts/perf_gate.py --results perf-results.json

      - name: Record a new baseline
        if: ${{ inputs.update_baseline }}
        run: |
          uv run python scripts/perf_gate.py --results perf-results.json --update-baseline
          echo "Commit deploy/perf-baseline.json to adopt it." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf-results.json
            deploy/perf-baseline.json
          retention-days: 30
