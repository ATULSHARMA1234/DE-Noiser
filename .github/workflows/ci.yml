name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    # The migration gate runs against Postgres as well as SQLite. It used to run
    # only on SQLite, which is how SQLite-shaped repair DDL ("BOOLEAN DEFAULT 1")
    # passed CI while being rejected by Postgres — the dialect actually deployed.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: semanticos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Blocking: lint must be clean.
      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      # Advisory: strict mypy is a goal, not yet met (tracked debt). Runs so the
      # error count is visible on every PR, but does not block until it reaches 0.
      - name: Type check with mypy (advisory)
        continue-on-error: true
        run: uv run mypy src/denoiser

      # Blocking: the migrations must build the real schema from empty, and
      # must match the models. Before this gate the chain had never been run at
      # all: it failed on the second revision, and the schema was actually
      # created by create_all with columns bolted on by ad-hoc ALTER probes.
      # `alembic check` is what keeps models and migrations from drifting again
      # — it fails whenever a model change has no accompanying migration.
      - name: Migration integrity (SQLite)
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Migration integrity (Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/semanticos_ci
        run: |
          uv run alembic upgrade head
          uv run alembic check
          # Legacy adoption is the path a real upgrade takes, and it is where
          # dialect-specific DDL breaks. Exercise it against Postgres, not just
          # the SQLite fixtures in the unit tests.
          uv run python -m tests.postgres_legacy_check

      # Blocking: tests + coverage floor. The floor is a ratchet — raise it as
      # coverage improves; it must never silently exceed real coverage again.
      - name: Test with pytest
        run: uv run pytest --cov=src tests/ --cov-fail-under=60

      # Advisory: surface known-vulnerable dependencies on every PR.
      - name: Dependency vulnerability scan (advisory)
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Blocking: type errors fail the build.
      - name: Type check
        run: npx tsc --noEmit

      # Blocking: lint errors (not warnings) fail the build.
      - name: Lint
        run: npx eslint .

      # Blocking: the production build must succeed before images are published.
      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/semanticos-api:${{ github.sha }},ghcr.io/${{ github.repository }}/semanticos-api:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository }}/semanticos-web:${{ github.sha }},ghcr.io/${{ github.repository }}/semanticos-web:latest
