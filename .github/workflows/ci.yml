name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Blocking: lint must be clean.
      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      # Advisory: strict mypy is a goal, not yet met (tracked debt). Runs so the
      # error count is visible on every PR, but does not block until it reaches 0.
      - name: Type check with mypy (advisory)
        continue-on-error: true
        run: uv run mypy src/denoiser

      # Blocking: tests + coverage floor. The floor is a ratchet — raise it as
      # coverage improves; it must never silently exceed real coverage again.
      - name: Test with pytest
        run: uv run pytest --cov=src tests/ --cov-fail-under=60

      # Advisory: surface known-vulnerable dependencies on every PR.
      - name: Dependency vulnerability scan (advisory)
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Blocking: type errors fail the build.
      - name: Type check
        run: npx tsc --noEmit

      # Blocking: lint errors (not warnings) fail the build.
      - name: Lint
        run: npx eslint .

      # Blocking: the production build must succeed before images are published.
      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/semanticos-api:${{ github.sha }},ghcr.io/${{ github.repository }}/semanticos-api:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository }}/semanticos-web:${{ github.sha }},ghcr.io/${{ github.repository }}/semanticos-web:latest
